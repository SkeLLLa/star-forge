<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">star-forge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3242"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3bfd1"/>
      <stop offset="0.18" stop-color="#7d8aa1"/>
      <stop offset="1" stop-color="#3f4859"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ff7a1a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- glow behind the star -->
  <circle cx="128" cy="94" r="86" fill="url(#glow)"/>

  <!-- anvil -->
  <path fill="url(#steel)" d="
    M30 146
    Q58 146 78 140
    L214 140
    L214 164
    L178 164
    Q166 168 164 182
    L164 192
    L186 204
    L186 214
    L70 214
    L70 204
    L92 192
    L92 182
    Q90 168 78 164
    Q50 162 30 146 Z"/>
  <path fill="#d7deea" opacity="0.55" d="M78 140 L214 140 L214 145 L80 145 Z"/>

  <!-- hot spot where the star was struck -->
  <ellipse cx="128" cy="141" rx="46" ry="7" fill="url(#heat)"/>

  <!-- the star -->
  <path fill="url(#star)" d="
    M128 40
    Q134 84 176 94
    Q134 104 128 132
    Q122 104 80 94
    Q122 84 128 40 Z"/>

  <!-- sparks -->
  <g fill="#ffc94d">
    <path d="M66 54 Q68 64 76 66 Q68 68 66 78 Q64 68 56 66 Q64 64 66 54 Z"/>
    <path d="M194 46 Q195.5 54 202 55.5 Q195.5 57 194 65 Q192.5 57 186 55.5 Q192.5 54 194 46 Z"/>
    <path d="M200 108 Q201 113 205 114 Q201 115 200 120 Q199 115 195 114 Q199 113 200 108 Z"/>
    <circle cx="58" cy="114" r="3"/>
    <circle cx="176" cy="128" r="2.5"/>
    <circle cx="86" cy="128" r="2"/>
  </g>
</svg>
