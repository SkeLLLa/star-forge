[package]
name = "star-forge"
version = "1.6.0"
edition = "2024"
rust-version = "1.88"
description = "Daemon and tiny client that cache statusline badges for starship, tmux and other prompts"
license = "GPL-3.0-or-later"
repository = "https://github.com/SkeLLLa/star-forge"
keywords = ["cli"]
categories = ["command-line-utilities"]
readme = "README.md"
include = [
  "/src/**/*.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/CHANGELOG.md",
  "/COPYING",
  "/THIRD_PARTY_NOTICES.md",
  "/docs/assets/logo.svg",
  "/docs/assets/badges/*.svg",
]
autobins = false

[[bin]]
name = "stfgd"
path = "src/main.rs"
required-features = ["daemon"]

[[bin]]
name = "stfg"
path = "src/bin/stfg.rs"

[features]
default = ["daemon"]
# Everything but the std+libc client; `--no-default-features --bin stfg` (the static musl
# release build) compiles only `libc`.
daemon = ["dep:tokio", "dep:serde", "dep:toml", "dep:serde_json", "dep:regex", "dep:reqwest"]

[package.metadata.deb]
maintainer = "SkeLLLa"
copyright = "2026, SkeLLLa"
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  ["target/release/stfgd", "usr/bin/stfgd", "755"],
  ["target/release/stfg", "usr/bin/stfg", "755"],
  ["README.md", "usr/share/doc/star-forge/README.md", "644"],
  ["COPYING", "usr/share/doc/star-forge/COPYING", "644"],
  ["THIRD_PARTY_NOTICES.md", "usr/share/doc/star-forge/THIRD_PARTY_NOTICES.md", "644"],
  ["packaging/systemd/star-forge.service", "usr/lib/systemd/user/star-forge.service", "644"],
]

[package.metadata.generate-rpm]
summary = "Cached statusline badges for starship, tmux and other prompts"
license = "GPL-3.0-or-later"
assets = [
  { source = "target/release/stfgd", dest = "/usr/bin/stfgd", mode = "755" },
  { source = "target/release/stfg", dest = "/usr/bin/stfg", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/star-forge/README.md", mode = "644", doc = true },
  { source = "COPYING", dest = "/usr/share/doc/star-forge/COPYING", mode = "644", doc = true },
  { source = "THIRD_PARTY_NOTICES.md", dest = "/usr/share/doc/star-forge/THIRD_PARTY_NOTICES.md", mode = "644", doc = true },
  { source = "packaging/systemd/star-forge.service", dest = "/usr/lib/systemd/user/star-forge.service", mode = "644" },
]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -3 }
nursery = { level = "warn", priority = -4 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
# Restriction lints (from https://github.com/morganlinton/BeautifulRust `lints/lints.toml`).
# Panics: `expect("why")` instead of `unwrap()`; a fn returning `Result` doesn't also panic.
unwrap_used = "warn"
panic_in_result_fn = "warn"
# Suppressions are `#[expect(.., reason = "..")]`, so they explain themselves and go stale loudly.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Every `unsafe` block carries a `// SAFETY:` comment and does one thing.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# `Arc::clone(&x)` so cheap clones are visible; `Arc<str>` over `Arc<String>`.
clone_on_ref_ptr = "warn"
rc_buffer = "warn"
# `From`/`TryFrom` instead of silently lossy `as`.
as_conversions = "warn"
string_add = "warn"
dbg_macro = "warn"
todo = "warn"

[dependencies]
tokio = { version = "1", optional = true, features = [
  "rt",
  "macros",
  "net",
  "process",
  "time",
  "sync",
  "io-util",
  "signal",
] }
serde = { version = "1", optional = true, features = ["derive"] }
toml = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls"] }
libc = "0.2"
