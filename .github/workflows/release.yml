name: Release

on:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: x86_64-unknown-linux-gnu

jobs:
  quality:
    name: Quality gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install stable Rust with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run quality checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --no-default-features --all-targets -- -D warnings
          cargo test
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  release:
    name: Release
    needs: quality
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release-plz.outputs.released }}
      version: ${{ steps.release-plz.outputs.version }}
      tag_name: ${{ steps.release-plz.outputs.tag_name }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Bump version and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-plz update --config release-plz.toml

      - name: Commit version bump
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by release-plz update"
            exit 0
          fi
          VERSION="$(awk -F '"' '/^version/ { print $2; exit }' Cargo.toml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD:master

      - name: Publish to crates.io and create GitHub release
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="${RUNNER_TEMP}/release-plz-output.json"
          release-plz release --config release-plz.toml --git-token "${GITHUB_TOKEN}" -o json | tee "${OUTPUT_FILE}"
          RELEASED="$(jq -r '((.releases // []) | length > 0)' "${OUTPUT_FILE}")"
          VERSION="$(jq -r '(.releases // [])[0].version // ""' "${OUTPUT_FILE}")"
          TAG_NAME="$(jq -r '(.releases // [])[0].tag // ""' "${OUTPUT_FILE}")"
          echo "released=${RELEASED}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Install packaging tools
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Install package verification tools
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build release binary
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo build --release --locked --target "${RUST_TARGET}"

      - name: Build static stfg
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --bin stfg --target x86_64-unknown-linux-musl
          install -m 755 target/x86_64-unknown-linux-musl/release/stfg "target/${RUST_TARGET}/release/stfg"
          file "target/${RUST_TARGET}/release/stfg" | grep -q static

      - name: Assemble binary distribution
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.release-plz.outputs.version }}
        run: |
          set -euo pipefail
          DIST_ROOT="target/dist/star-forge-${VERSION}-${RUST_TARGET}"
          mkdir -p "${DIST_ROOT}/bin"
          install -m 755 "target/${RUST_TARGET}/release/stfgd" "target/${RUST_TARGET}/release/stfg" "${DIST_ROOT}/bin/"
          install -m 644 README.md COPYING THIRD_PARTY_NOTICES.md "${DIST_ROOT}/"
          tar -C target/dist -czf "target/dist/star-forge-${VERSION}-${RUST_TARGET}.tar.gz" "star-forge-${VERSION}-${RUST_TARGET}"

      - name: Build deb package
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo deb --no-build --target "${RUST_TARGET}" --output "target/debian/star-forge_${{ steps.release-plz.outputs.version }}_amd64.deb"

      - name: Build rpm package
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: cargo generate-rpm --target "${RUST_TARGET}" --output "target/generate-rpm/star-forge-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm"

      - name: Verify package contents
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        run: |
          set -euo pipefail
          deb="target/debian/star-forge_${{ steps.release-plz.outputs.version }}_amd64.deb"
          rpm="target/generate-rpm/star-forge-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm"
          files=(
            /usr/bin/stfgd
            /usr/bin/stfg
            /usr/share/doc/star-forge/README.md
            /usr/share/doc/star-forge/COPYING
            /usr/share/doc/star-forge/THIRD_PARTY_NOTICES.md
            /usr/lib/systemd/user/star-forge.service
          )
          for path in "${files[@]}"; do
            dpkg-deb --contents "${deb}" | awk '{print $6}' | grep -Fx ".${path}" >/dev/null
            rpm -qlp "${rpm}" | grep -Fx "${path}" >/dev/null
          done

      - name: Stage release artifacts
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        env:
          VERSION: ${{ steps.release-plz.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="target/release-assets"
          mkdir -p "${STAGE}"
          cp "target/dist/star-forge-${VERSION}-${RUST_TARGET}.tar.gz" "${STAGE}/"
          cp "target/debian/star-forge_${VERSION}_amd64.deb" "${STAGE}/"
          cp "target/generate-rpm/star-forge-${VERSION}-1.x86_64.rpm" "${STAGE}/"
          (
            cd "${STAGE}"
            assets=(
              "star-forge-${VERSION}-${RUST_TARGET}.tar.gz"
              "star-forge_${VERSION}_amd64.deb"
              "star-forge-${VERSION}-1.x86_64.rpm"
            )
            for asset in "${assets[@]}"; do
              sha256sum -- "${asset}" > "${asset}.sha256"
            done
          )

      - name: Attest build provenance
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/release-assets/star-forge-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz
            target/release-assets/star-forge_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/star-forge-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm

      - name: Publish release assets
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-plz.outputs.tag_name }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            target/release-assets/star-forge-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz
            target/release-assets/star-forge_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/star-forge-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm
            target/release-assets/star-forge-${{ steps.release-plz.outputs.version }}-${{ env.RUST_TARGET }}.tar.gz.sha256
            target/release-assets/star-forge_${{ steps.release-plz.outputs.version }}_amd64.deb.sha256
            target/release-assets/star-forge-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm.sha256

      - name: Upload package repository inputs
        if: ${{ steps.release-plz.outputs.released == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: package-repository-inputs
          retention-days: 1
          path: |
            target/release-assets/star-forge_${{ steps.release-plz.outputs.version }}_amd64.deb
            target/release-assets/star-forge-${{ steps.release-plz.outputs.version }}-1.x86_64.rpm

  macos-assets:
    name: macOS assets (${{ matrix.target }})
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Assemble binary distribution
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="target/release-assets"
          DIST_ROOT="target/dist/star-forge-${VERSION}-${TARGET}"
          mkdir -p "${DIST_ROOT}/bin" "${STAGE}"
          install -m 755 "target/${TARGET}/release/stfgd" "target/${TARGET}/release/stfg" "${DIST_ROOT}/bin/"
          install -m 644 README.md COPYING THIRD_PARTY_NOTICES.md "${DIST_ROOT}/"
          tar -C target/dist -czf "${STAGE}/star-forge-${VERSION}-${TARGET}.tar.gz" "star-forge-${VERSION}-${TARGET}"
          (
            cd "${STAGE}"
            shasum -a 256 "star-forge-${VERSION}-${TARGET}.tar.gz" > "star-forge-${VERSION}-${TARGET}.tar.gz.sha256"
          )
          # Only the native slice can be executed on the arm64 runner.
          if [ "${TARGET}" = "aarch64-apple-darwin" ]; then
            # `stfg` always exits 0; with no daemon it spawns one, so stop it afterwards.
            export STAR_FORGE_CONFIG=/dev/null XDG_RUNTIME_DIR="${RUNNER_TEMP}"
            "${DIST_ROOT}/bin/stfg" smoke
            "${DIST_ROOT}/bin/stfgd" stop || true
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/release-assets/star-forge-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.gz

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            target/release-assets/star-forge-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.gz
            target/release-assets/star-forge-${{ needs.release.outputs.version }}-${{ matrix.target }}.tar.gz.sha256

  linux-musl-assets:
    name: Linux musl assets (x86_64-unknown-linux-musl)
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      # aws-lc-sys (rustls crypto) compiles C through the `musl-gcc` wrapper from musl-tools.
      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "${TARGET}"

      - name: Assemble binary distribution
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="target/release-assets"
          DIST_ROOT="target/dist/star-forge-${VERSION}-${TARGET}"
          mkdir -p "${DIST_ROOT}/bin" "${STAGE}"
          install -m 755 "target/${TARGET}/release/stfgd" "target/${TARGET}/release/stfg" "${DIST_ROOT}/bin/"
          install -m 644 README.md COPYING THIRD_PARTY_NOTICES.md "${DIST_ROOT}/"
          tar -C target/dist -czf "${STAGE}/star-forge-${VERSION}-${TARGET}.tar.gz" "star-forge-${VERSION}-${TARGET}"
          (
            cd "${STAGE}"
            sha256sum -- "star-forge-${VERSION}-${TARGET}.tar.gz" > "star-forge-${VERSION}-${TARGET}.tar.gz.sha256"
          )
          # The point of this target: no dynamic loader, no shared libraries.
          for bin in stfgd stfg; do
            file "${DIST_ROOT}/bin/${bin}" | grep -q 'static'
          done
          # `stfg` always exits 0; with no daemon it spawns one, so stop it afterwards.
          export STAR_FORGE_CONFIG=/dev/null XDG_RUNTIME_DIR="${RUNNER_TEMP}"
          "${DIST_ROOT}/bin/stfg" smoke
          "${DIST_ROOT}/bin/stfgd" stop || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/release-assets/star-forge-${{ needs.release.outputs.version }}-x86_64-unknown-linux-musl.tar.gz

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          append_body: true
          fail_on_unmatched_files: true
          files: |
            target/release-assets/star-forge-${{ needs.release.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            target/release-assets/star-forge-${{ needs.release.outputs.version }}-x86_64-unknown-linux-musl.tar.gz.sha256

  packslip:
    name: Publish packslip manifest
    needs: [release, macos-assets]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Runs after the glibc Linux and macOS tarballs are on the release, so one
      # manifest covers them. The musl tarball is deliberately left out: packslip has no
      # libc selector, so a second linux-x64 asset would make installs ambiguous.
      - name: Publish packslip manifest
        uses: jdx/packslip@v1
        with:
          download: star-forge-*-unknown-linux-gnu.tar.gz star-forge-*-apple-darwin.tar.gz
          bin: stfgd stfg
          tag: ${{ needs.release.outputs.tag_name }}
          version: ${{ needs.release.outputs.version }}
          attest: link

  checksums:
    name: Publish SHA256SUMS
    needs: [release, macos-assets, linux-musl-assets]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Single writer: merge every per-asset .sha256 (Linux, musl, macOS) into one manifest.
      - name: Assemble and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir sums && cd sums
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*.sha256'
          cat -- *.sha256 | sort -k2 > SHA256SUMS
          gh release upload "${TAG_NAME}" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber

  package-repositories:
    name: Publish package repositories
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: package-repositories
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download current package artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-repository-inputs
          path: target/release-assets

      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y createrepo-c dpkg-dev

      - name: Build GitHub Pages package repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
          PAGES_URL: https://skellla.github.io/star-forge
        run: |
          set -euo pipefail

          repo_root="public"
          rpm_dir="${repo_root}/rpm/x86_64"
          deb_root="${repo_root}/deb"
          deb_pool="${deb_root}/pool/main/s/star-forge"
          deb_binary="${deb_root}/dists/stable/main/binary-amd64"
          previous_assets="${RUNNER_TEMP}/previous-package-assets"

          mkdir -p "${rpm_dir}" "${deb_pool}" "${deb_binary}" "${previous_assets}"

          # Keep the last few releases in the repositories, not just the new one.
          mapfile -t previous_tags < <(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 20 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' \
              | grep -vxF "${TAG_NAME}" \
              | head -9 || true
          )

          for tag in "${previous_tags[@]}"; do
            tag_dir="${previous_assets}/${tag}"
            mkdir -p "${tag_dir}"
            gh release download "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern 'star-forge-*-1.x86_64.rpm' \
              --pattern 'star-forge_*_amd64.deb' \
              --dir "${tag_dir}" \
              --clobber || true
          done

          find "${previous_assets}" -type f -name '*.rpm' -exec cp -n {} "${rpm_dir}/" \;
          find "${previous_assets}" -type f -name '*.deb' -exec cp -n {} "${deb_pool}/" \;
          cp "target/release-assets/star-forge-${VERSION}-1.x86_64.rpm" "${rpm_dir}/"
          cp "target/release-assets/star-forge_${VERSION}_amd64.deb" "${deb_pool}/"

          createrepo_c --update --compatibility "${rpm_dir}"

          (
            cd "${deb_root}"
            dpkg-scanpackages --multiversion --arch amd64 pool /dev/null > dists/stable/main/binary-amd64/Packages
            gzip -9 -kf dists/stable/main/binary-amd64/Packages
          )

          write_hash_block() {
            local label="$1"
            shift
            echo "${label}:"
            for file in "$@"; do
              local hash
              local size
              case "${label}" in
                MD5Sum) hash="$(md5sum "${file}" | awk '{ print $1 }')" ;;
                SHA1) hash="$(sha1sum "${file}" | awk '{ print $1 }')" ;;
                SHA256) hash="$(sha256sum "${file}" | awk '{ print $1 }')" ;;
              esac
              size="$(wc -c < "${file}")"
              printf ' %s %16s %s\n' "${hash}" "${size}" "${file}"
            done
          }

          (
            cd "${deb_root}/dists/stable"
            {
              echo "Origin: star-forge"
              echo "Label: star-forge"
              echo "Suite: stable"
              echo "Codename: stable"
              echo "Date: $(date -Ru)"
              echo "Architectures: amd64"
              echo "Components: main"
              echo "Description: star-forge APT repository"
              write_hash_block MD5Sum main/binary-amd64/Packages main/binary-amd64/Packages.gz
              write_hash_block SHA1 main/binary-amd64/Packages main/binary-amd64/Packages.gz
              write_hash_block SHA256 main/binary-amd64/Packages main/binary-amd64/Packages.gz
            } > Release
          )

          cat > "${repo_root}/rpm/star-forge.repo" <<EOF
          [star-forge]
          name=star-forge
          baseurl=${PAGES_URL}/rpm/x86_64
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          EOF

          cat > "${deb_root}/star-forge.list" <<EOF
          deb [trusted=yes] ${PAGES_URL}/deb stable main
          EOF

          : > "${repo_root}/.nojekyll"

          cat > "${repo_root}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>star-forge package repositories</title>
            </head>
            <body>
              <h1>star-forge package repositories</h1>
              <h2>RPM / DNF / YUM</h2>
              <pre>sudo tee /etc/yum.repos.d/star-forge.repo &gt;/dev/null &lt;&lt;'REPO'
          [star-forge]
          name=star-forge
          baseurl=${PAGES_URL}/rpm/x86_64
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          REPO
          sudo dnf install star-forge</pre>
              <h2>APT</h2>
              <pre>echo 'deb [trusted=yes] ${PAGES_URL}/deb stable main' | sudo tee /etc/apt/sources.list.d/star-forge.list
          sudo apt update
          sudo apt install star-forge</pre>
              <p>These repositories are unsigned. GitHub Releases remain the long-term artifact archive.</p>
            </body>
          </html>
          EOF

      - name: Verify generated package repositories
        run: |
          set -euo pipefail
          test -f public/rpm/x86_64/repodata/repomd.xml
          test -f public/deb/dists/stable/Release
          test -f public/deb/dists/stable/main/binary-amd64/Packages.gz
          # No `grep -q`: it exits on the first match, gzip dies of SIGPIPE, pipefail fails.
          gzip -cd public/deb/dists/stable/main/binary-amd64/Packages.gz | grep '^Package: star-forge$' >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
