# Release fails closed until every action is pinned to a commit SHA (pin-gate).
name: Release

on:
  push:
    branches:
      - master

# One release at a time: a push during a release waits for it instead of cancelling it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

# Release jobs restore no cargo cache: a cache entry written by any master workflow could
# otherwise plant build output in a release artifact.
jobs:
  pin-gate:
    name: Action pin gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every action in every workflow to be pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fetch every workflow, the checker and its image list, as committed at the
          # triggering SHA; no checkout, no third-party action. Fails closed: no files, no
          # listing or any failed fetch fails the gate, and so does an unpinned action in ci.yml.
          dir="${RUNNER_TEMP}/workflows"
          mkdir -p "${dir}" "${RUNNER_TEMP}/scripts" "${RUNNER_TEMP}/packaging/ci"
          fetch() {
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${GITHUB_REPOSITORY}/contents/$1?ref=${GITHUB_SHA}"
          }
          names="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=${GITHUB_SHA}" \
              --jq '.[] | select(.type == "file") | select(.name | test("\\.ya?ml$")) | .name'
          )"
          if [ -z "${names}" ]; then
            echo "::error::no workflow files found at ${GITHUB_SHA}"
            exit 1
          fi
          files=()
          while IFS= read -r name; do
            case "${name}" in */* | "") echo "::error::unexpected workflow name"; exit 1 ;; esac
            fetch ".github/workflows/${name}" > "${dir}/${name}"
            files+=("${dir}/${name}")
          done <<< "${names}"
          fetch scripts/check-action-pins.sh > "${RUNNER_TEMP}/scripts/check-action-pins.sh"
          fetch packaging/ci/images.env > "${RUNNER_TEMP}/packaging/ci/images.env"
          sh "${RUNNER_TEMP}/scripts/check-action-pins.sh" "${files[@]}"

  quality:
    name: Quality gate
    needs: pin-gate
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (version from .mise.toml)
        run: |
          set -eu
          v="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${v}"
          rustup toolchain install "${v}" --profile minimal --component clippy,rustfmt
          rustup default "${v}"
      - name: Run quality checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          cargo test --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --document-private-items

  # Bumps the version, commits and tags it, publishes the crate and creates the GitHub release.
  # The release artifacts are built afterwards, by jobs that hold no write access.
  release:
    name: Release
    needs: quality
    if: ${{ github.repository_owner == 'SkeLLLa' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      released: ${{ steps.release-plz.outputs.released }}
      version: ${{ steps.release-plz.outputs.version }}
      tag_name: ${{ steps.release-plz.outputs.tag_name }}
    # contents: the bump commit, the tag and the release; id-token: crates.io trusted publishing.
    permissions:
      contents: write
      id-token: write
    steps:
      # Credentials persist on purpose: this job pushes the bump commit.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust (version from .mise.toml)
        run: |
          set -eu
          v="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${v}"
          rustup toolchain install "${v}" --profile minimal
          rustup default "${v}"

      - name: Authenticate to crates.io (trusted publishing)
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1

      # Install via cargo-binstall like release-plz/action does: it picks the gnu build, while
      # install-action only ships musl builds, which fail parsing the changelog template since
      # 0.3.172 ("stack limit reached").
      - name: Install release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall release-plz@0.4.0 --strategies crate-meta-data --no-confirm
          release-plz --version

      - name: Bump version and changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: release-plz update --config release-plz.toml

      - name: Commit version bump
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes produced by release-plz update"
            exit 0
          fi
          VERSION="$(awk -F '"' '/^version/ { print $2; exit }' Cargo.toml)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git push origin HEAD:master

      - name: Publish to crates.io and create GitHub release
        id: release-plz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          OUTPUT_FILE="${RUNNER_TEMP}/release-plz-output.json"
          release-plz release --config release-plz.toml --git-token "${GITHUB_TOKEN}" -o json | tee "${OUTPUT_FILE}"
          RELEASED="$(jq -r '((.releases // []) | length > 0)' "${OUTPUT_FILE}")"
          VERSION="$(jq -r '(.releases // [])[0].version // ""' "${OUTPUT_FILE}")"
          TAG_NAME="$(jq -r '(.releases // [])[0].tag // ""' "${OUTPUT_FILE}")"
          {
            echo "released=${RELEASED}"
            echo "version=${VERSION}"
            echo "tag_name=${TAG_NAME}"
          } >> "${GITHUB_OUTPUT}"

  # --- Build (read-only) ---------------------------------------------------------------------
  linux-assets:
    name: Linux assets (x86_64-unknown-linux-gnu)
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Checksums and provenance come from the checksums job, the upload from publish-assets.
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Install Rust (version from .mise.toml)
        run: |
          set -eu
          v="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${v}"
          rustup toolchain install "${v}" --profile minimal \
            --target x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl
          rustup default "${v}"

      # Independent: tool compiles use cargo install's own temp target dir, so they don't
      # contend with the release build for the target/ lock. The static stfg build below
      # overwrites the gnu stfg, so it stays after this group.
      - parallel:
          - name: Install packaging tools
            run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

          - name: Install package verification tools
            run: sudo apt-get update && sudo apt-get install -y rpm

          - name: Build release binary
            run: cargo build --release --locked --target "${TARGET}"

      - name: Build static stfg
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --bin stfg --target x86_64-unknown-linux-musl
          install -m 755 target/x86_64-unknown-linux-musl/release/stfg "target/${TARGET}/release/stfg"
          file "target/${TARGET}/release/stfg" | grep -q static

      - name: Assemble binary distribution
        run: |
          set -euo pipefail
          DIST_ROOT="target/dist/star-forge-${VERSION}-${TARGET}"
          mkdir -p "${DIST_ROOT}/bin"
          install -m 755 "target/${TARGET}/release/stfgd" "target/${TARGET}/release/stfg" "${DIST_ROOT}/bin/"
          install -m 644 README.md COPYING THIRD_PARTY_NOTICES.md "${DIST_ROOT}/"
          tar -C target/dist -czf "target/dist/star-forge-${VERSION}-${TARGET}.tar.gz" "star-forge-${VERSION}-${TARGET}"

      - name: Build deb package
        run: cargo deb --no-build --target "${TARGET}" --output "target/debian/star-forge_${VERSION}_amd64.deb"

      - name: Build rpm package
        run: cargo generate-rpm --target "${TARGET}" --output "target/generate-rpm/star-forge-${VERSION}-1.x86_64.rpm"

      - name: Verify package contents
        run: |
          set -euo pipefail
          deb="target/debian/star-forge_${VERSION}_amd64.deb"
          rpm="target/generate-rpm/star-forge-${VERSION}-1.x86_64.rpm"
          files=(
            /usr/bin/stfgd
            /usr/bin/stfg
            /usr/share/doc/star-forge/README.md
            /usr/share/doc/star-forge/COPYING
            /usr/share/doc/star-forge/THIRD_PARTY_NOTICES.md
            /usr/lib/systemd/user/star-forge.service
          )
          for path in "${files[@]}"; do
            dpkg-deb --contents "${deb}" | awk '{print $6}' | grep -Fx ".${path}" >/dev/null
            rpm -qlp "${rpm}" | grep -Fx "${path}" >/dev/null
          done

      # One artifact per kind; sign-linux replaces release-linux-rpm with the signed file.
      - name: Keep the tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-gnu
          retention-days: 1
          if-no-files-found: error
          path: target/dist/star-forge-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz

      - name: Keep the deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-deb
          retention-days: 1
          if-no-files-found: error
          path: target/debian/star-forge_${{ env.VERSION }}_amd64.deb

      - name: Keep the rpm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm
          retention-days: 1
          if-no-files-found: error
          path: target/generate-rpm/star-forge-${{ env.VERSION }}-1.x86_64.rpm

  # Signs the .rpm with the subkey held in the linux-signing environment, checked against the
  # pin packaging/signing/repo.asc; without the pin (and the secret) the package passes through
  # unsigned. The .deb carries no signature of its own: APT checks the repository's signed
  # InRelease instead (the repo job). No build runs in a job that holds the key.
  sign-linux:
    name: Sign Linux packages
    needs: [release, linux-assets]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    permissions:
      contents: read
    # The key lives only in this environment's secrets, limited to master; see
    # docs/distribution.md#linux-signing.
    environment: linux-signing
    steps:
      - name: Install git, rpm-sign and gnupg
        run: dnf install -y -q git-core rpm-sign gnupg2

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-rpm
          path: dist

      # The key is imported, used and removed in this one step; import fails closed against
      # the pin and sets LINUX_SIGNED.
      - name: Sign the package
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          set -eu
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          packaging/ci/linux-signing.sh import
          if [ -f packaging/signing/repo.asc ]; then
            packaging/ci/linux-signing.sh sign-rpm dist/*.rpm
          fi

      - name: Replace the package with the signed one
        if: ${{ env.LINUX_SIGNED == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm
          retention-days: 1
          if-no-files-found: error
          overwrite: true
          path: dist/*.rpm

  # Install the packages about to be published on clean systems, as users would.
  verify-linux:
    name: Verify Linux ${{ matrix.kind }} (${{ matrix.name }})
    needs: [release, sign-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fedora-44, image: "fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80", kind: rpm }
          - { name: debian-trixie, image: "debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308", kind: deb }
          - { name: ubuntu-26.04, image: "ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944", kind: deb }
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.kind }}
          path: dist

      # As dnf checks it with gpgcheck=1, against the committed key rather than the one used.
      - name: Check the package signature
        if: ${{ matrix.kind == 'rpm' }}
        run: |
          if [ -f packaging/signing/repo.asc ]; then
            packaging/ci/linux-signing.sh check-rpm dist/*.rpm
          else
            echo "packaging/signing/repo.asc is not committed: the package is unsigned"
          fi

      # `stfg` always exits 0; with no daemon it spawns one, so stop it afterwards.
      - name: Install and run
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -eu
          if [ "${KIND}" = rpm ]; then
            dnf install -y -q ./dist/*.rpm
          else
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/*.deb
          fi
          test -f /usr/lib/systemd/user/star-forge.service
          export STAR_FORGE_CONFIG=/dev/null XDG_RUNTIME_DIR="${RUNNER_TEMP}"
          stfg smoke
          stfgd stop || true

  linux-musl-assets:
    name: Linux musl assets (x86_64-unknown-linux-musl)
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-musl
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust (version from .mise.toml)
        run: |
          set -eu
          v="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${v}"
          rustup toolchain install "${v}" --profile minimal --target "${TARGET}"
          rustup default "${v}"

      # aws-lc-sys (rustls crypto) compiles C through the `musl-gcc` wrapper from musl-tools.
      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "${TARGET}"

      - name: Assemble binary distribution
        run: |
          set -euo pipefail
          STAGE="target/release-assets"
          DIST_ROOT="target/dist/star-forge-${VERSION}-${TARGET}"
          mkdir -p "${DIST_ROOT}/bin" "${STAGE}"
          install -m 755 "target/${TARGET}/release/stfgd" "target/${TARGET}/release/stfg" "${DIST_ROOT}/bin/"
          install -m 644 README.md COPYING THIRD_PARTY_NOTICES.md "${DIST_ROOT}/"
          tar -C target/dist -czf "${STAGE}/star-forge-${VERSION}-${TARGET}.tar.gz" "star-forge-${VERSION}-${TARGET}"
          # The point of this target: no dynamic loader, no shared libraries.
          for bin in stfgd stfg; do
            file "${DIST_ROOT}/bin/${bin}" | grep -q 'static'
          done
          # `stfg` always exits 0; with no daemon it spawns one, so stop it afterwards.
          export STAR_FORGE_CONFIG=/dev/null XDG_RUNTIME_DIR="${RUNNER_TEMP}"
          "${DIST_ROOT}/bin/stfg" smoke
          "${DIST_ROOT}/bin/stfgd" stop || true

      - name: Keep release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-musl
          retention-days: 1
          if-no-files-found: error
          path: target/release-assets/star-forge-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz

  macos-assets:
    name: macOS assets (${{ matrix.target }})
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    permissions:
      contents: read
    # The signing key lives only in this environment's secrets. Its deployment-branch rule
    # (master only) keeps it out of reach of workflows run from any other branch, tag or PR;
    # see docs/distribution.md#signing.
    environment: macos-signing
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.release.outputs.version }}
      # A presence flag only (a boolean, never a secret value); each secret itself is set in the
      # env of the one step that needs it.
      SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      # The committed pin is the signing identity. Once it exists every release must be signed
      # with it: an ad-hoc or differently signed release would reset every user's grants.
      - name: Resolve the signing identity
        run: |
          set -euo pipefail
          PIN_FILE="packaging/signing/release.sha1"
          if [ -f "${PIN_FILE}" ]; then
            PIN="$(tr -d '[:space:]' < "${PIN_FILE}" | tr '[:lower:]' '[:upper:]')"
            if ! printf '%s' "${PIN}" | grep -Eq '^[0-9A-F]{40}$'; then
              echo "::error::${PIN_FILE} must hold one 40-digit SHA-1"
              exit 1
            fi
            if [ "${SIGNING_CONFIGURED}" != "true" ]; then
              echo "::error::${PIN_FILE} is committed but the macos-signing environment has no MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_PASSWORD"
              exit 1
            fi
            echo "CODESIGN_IDENTITY=${PIN}" >> "${GITHUB_ENV}"
          elif [ "${SIGNING_CONFIGURED}" = "true" ]; then
            echo "::error::signing secrets are set but ${PIN_FILE} is missing; commit the certificate's SHA-1"
            exit 1
          fi

      - name: Install Rust (version from .mise.toml)
        run: |
          set -eu
          v="$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
          test -n "${v}"
          rustup toolchain install "${v}" --profile minimal --target "${TARGET}"
          rustup default "${v}"

      # Compiled before the key is imported, so no dependency build script or proc macro runs
      # while it is in a keychain.
      - name: Build release binary
        run: cargo build --release --locked --target "${TARGET}"

      - name: Import the signing certificate
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 900 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          # -x: the private key can't be exported again; -T: only codesign may use it.
          security import "${RUNNER_TEMP}/certificate.p12" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -x -t agg -f pkcs12 -k "${KEYCHAIN}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          rm -f "${RUNNER_TEMP}/certificate.p12"
          # The secret must hold the pinned certificate, not just any identity.
          if ! security find-identity -p codesigning "${KEYCHAIN}" | grep -q " ${CODESIGN_IDENTITY} "; then
            echo "::error::MACOS_CERTIFICATE_P12 does not hold the identity pinned in packaging/signing/release.sha1"
            exit 1
          fi

      # CODESIGN_IDENTITY is the pin when signing (set above), unset otherwise: sign.sh then
      # signs ad hoc. With a pin it also verifies the designated requirement.
      - name: Sign the binaries
        run: sh packaging/macos/sign.sh "target/${TARGET}/release"

      - name: Remove signing keychain and certificate
        if: ${{ env.SIGNING_CONFIGURED == 'true' }}
        run: |
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security delete-keychain "${RUNNER_TEMP}/build.keychain-db" || true

      - name: Assemble binary distribution
        run: |
          set -euo pipefail
          STAGE="target/release-assets"
          DIST_ROOT="target/dist/star-forge-${VERSION}-${TARGET}"
          mkdir -p "${DIST_ROOT}/bin" "${STAGE}"
          install -m 755 "target/${TARGET}/release/stfgd" "target/${TARGET}/release/stfg" "${DIST_ROOT}/bin/"
          install -m 644 README.md COPYING THIRD_PARTY_NOTICES.md "${DIST_ROOT}/"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C target/dist \
            -czf "${STAGE}/star-forge-${VERSION}-${TARGET}.tar.gz" "star-forge-${VERSION}-${TARGET}"
          # The identity each leg signed with; publish-assets checks they agree.
          printf '%s\n' "${CODESIGN_IDENTITY:-adhoc}" > "${STAGE}/signing-${TARGET}.txt"
          # Only the native slice can be executed on the arm64 runner.
          if [ "${TARGET}" = "aarch64-apple-darwin" ]; then
            # `stfg` always exits 0; with no daemon it spawns one, so stop it afterwards.
            export STAR_FORGE_CONFIG=/dev/null XDG_RUNTIME_DIR="${RUNNER_TEMP}"
            "${DIST_ROOT}/bin/stfg" smoke
            "${DIST_ROOT}/bin/stfgd" stop || true
          fi

      - name: Keep release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error
          path: target/release-assets/star-forge-${{ env.VERSION }}-${{ env.TARGET }}.tar.gz

      - name: Keep the signing identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error
          path: target/release-assets/signing-${{ env.TARGET }}.txt

      - name: Remove temporary keychain and certificate
        if: ${{ always() && env.SIGNING_CONFIGURED == 'true' }}
        run: |
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security delete-keychain "${RUNNER_TEMP}/build.keychain-db" || true

  # --- Publish -------------------------------------------------------------------------------
  # Hashes and attests every asset, on a job that never sees the signing key and can't write
  # the release.
  checksums:
    name: Checksums and provenance
    needs: [release, linux-assets, linux-musl-assets, macos-assets, sign-linux, verify-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Write checksums
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            "star-forge-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "star-forge-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            "star-forge-${VERSION}-aarch64-apple-darwin.tar.gz"
            "star-forge-${VERSION}-x86_64-apple-darwin.tar.gz"
            "star-forge_${VERSION}_amd64.deb"
            "star-forge-${VERSION}-1.x86_64.rpm"
          )
          for f in "${expected[@]}"; do
            test -f "${f}" || { echo "::error::${f} is missing"; exit 1; }
            sha256sum -- "${f}" > "${f}.sha256"
          done
          if [ "$(find . -maxdepth 1 -type f ! -name '*.sha256' | wc -l)" -ne "${#expected[@]}" ]; then
            echo "::error::unexpected files in release-assets"
            ls -la
            exit 1
          fi
          sha256sum -- "${expected[@]}" | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/star-forge-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            release-assets/star-forge-${{ env.VERSION }}-x86_64-unknown-linux-musl.tar.gz
            release-assets/star-forge-${{ env.VERSION }}-aarch64-apple-darwin.tar.gz
            release-assets/star-forge-${{ env.VERSION }}-x86_64-apple-darwin.tar.gz
            release-assets/star-forge_${{ env.VERSION }}_amd64.deb
            release-assets/star-forge-${{ env.VERSION }}-1.x86_64.rpm

      # publish-assets merges these with the assets.
      - name: Keep the checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          retention-days: 1
          if-no-files-found: error
          path: |
            release-assets/*.sha256
            release-assets/SHA256SUMS

  publish-assets:
    name: Publish release assets
    needs: [release, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Fetch the checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: release-assets

      - name: Fetch the signing identities
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signing-*
          merge-multiple: true
          path: signing

      # The macOS signing caveat, appended once to the notes release-plz wrote.
      - name: Write the release note
        run: |
          set -euo pipefail
          ids="$(sort -u signing/signing-*.txt)"
          if [ "$(printf '%s\n' "${ids}" | wc -l)" -ne 1 ] || [ "$(find signing -type f | wc -l)" -ne 2 ]; then
            echo "::error::the macOS legs disagree on the signing identity"
            cat signing/*
            exit 1
          fi
          if [ "${ids}" = "adhoc" ]; then
            echo "::warning::Release is ad-hoc signed (packaging/signing/release.sha1 is not committed)"
          fi
          {
            echo "## macOS"
            echo
            if [ "${ids}" = "adhoc" ]; then
              echo "> **Note:** the macOS binaries are ad-hoc signed and not notarized by Apple, so"
              echo "> macOS asks again for any permission you gave \`stfgd\` after each update."
            else
              echo "> **Note:** the macOS binaries are signed with star-forge's own certificate, not"
              echo "> notarized by Apple. To check one, \`codesign -dr - stfgd\` must print"
              echo "> \`certificate leaf = H\"$(printf %s "${ids}" | tr A-F a-f)\"\`."
            fi
            echo "> A tarball downloaded with a browser is quarantined: run"
            echo "> \`xattr -dr com.apple.quarantine <extracted dir>\` before the first start."
          } > macos-note.md

      # Uploads the assets (replacing them on a rerun) and appends the note unless it's there.
      # gh, not a release action: the job already holds the token, and the loop fails on a
      # missing file.
      - name: Upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s failglob
          assets=(
            "release-assets/star-forge-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "release-assets/star-forge-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            "release-assets/star-forge-${VERSION}-aarch64-apple-darwin.tar.gz"
            "release-assets/star-forge-${VERSION}-x86_64-apple-darwin.tar.gz"
            "release-assets/star-forge_${VERSION}_amd64.deb"
            "release-assets/star-forge-${VERSION}-1.x86_64.rpm"
            release-assets/*.sha256
            release-assets/SHA256SUMS
          )
          for asset in "${assets[@]}"; do
            test -f "${asset}" || { echo "::error::missing asset ${asset}"; exit 1; }
          done
          gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
          gh release view "${TAG_NAME}" --json body --jq .body > notes.md
          if ! grep -qxF "## macOS" notes.md; then
            printf '\n' >> notes.md
            cat macos-note.md >> notes.md
            gh release edit "${TAG_NAME}" --notes-file notes.md
          fi

  packslip:
    name: Sign packslip manifest
    needs: [release, publish-assets]
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signing never holds release-write access; publish-packslip uploads the bundle.
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag sits on release-plz's version-bump commit, not on github.sha (the push
      # that triggered this run), so record the commit the tag actually names.
      - name: Resolve tagged commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          echo "commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_NAME}" --jq .sha)" >> "${GITHUB_OUTPUT}"

      # Runs after every tarball is on the release, so one manifest covers them. The gnu
      # and musl Linux tarballs share linux/x86_64 but differ in libc, so consumers pick
      # by host libc.
      - name: Sign packslip manifest
        id: packslip
        uses: jdx/packslip@7d397618045bd98b76cd5cb8177767b2f52789b8 # v1.10.1
        with:
          download: star-forge-*-unknown-linux-*.tar.gz star-forge-*-apple-darwin.tar.gz
          bin: stfgd stfg
          tag: ${{ needs.release.outputs.tag_name }}
          version: ${{ needs.release.outputs.version }}
          commit: ${{ steps.source.outputs.commit }}
          attest: link
          upload: false

      - name: Keep signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packslip-bundle
          retention-days: 1
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    name: Publish packslip manifest
    needs: [release, packslip]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch signed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packslip-bundle
          path: packslip

      - name: Upload signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          test -f packslip/packslip.sigstore.json
          gh release upload "${TAG_NAME}" packslip/packslip.sigstore.json --repo "${GITHUB_REPOSITORY}" --clobber

  verify-packslip:
    name: Verify published packslip manifest
    needs: [release, publish-packslip]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Signer fingerprint published in README.md; constant across releases.
      PACKSLIP_PIN: ps1_iqg6ch676syauz3nb3hluddyku
    steps:
      - name: Install packslip
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: packslip@1.6.0

      # Check what users download: the public release URLs, not this run's local files.
      - name: Verify manifest against published tarballs
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}"
          args=()
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            asset="star-forge-${VERSION}-${target}.tar.gz"
            curl -fsSLO --retry 3 "${base}/${asset}"
            args+=(--artifact "${asset}")
          done
          curl -fsSLO --retry 3 "${base}/packslip.sigstore.json"
          packslip verify packslip.sigstore.json \
            --identity-prefix "https://github.com/${GITHUB_REPOSITORY}/" \
            --issuer https://token.actions.githubusercontent.com \
            --pin "${PACKSLIP_PIN}" \
            "${args[@]}"

  # The APT and DNF repositories on GitHub Pages (Settings → Pages → Source: GitHub Actions):
  # packaging/ci/pages-repo.sh builds them from this run's verified .deb and .rpm plus those of
  # the 9 releases before it, since each deploy replaces the site. Unsigned until
  # packaging/signing/repo.asc is committed; from then on the metadata and every .rpm are
  # signed with that key, and the release fails without it (docs/distribution.md#linux-signing).
  # PAGES_BASE_URL overrides the URL for a custom domain. This job holds the signing key and
  # builds the site; `pages` only deploys it.
  repo:
    name: Build APT and DNF repositories
    needs: [release, publish-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Trixie's rpm (4.20, Sequoia) reads a pin with revoked subkeys; the runner's 4.18 can't.
    container: debian:trixie@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    # In a container, run steps default to sh (dash); these use mapfile and ${var,,}.
    defaults:
      run:
        shell: bash
    environment: linux-signing
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG_NAME: ${{ needs.release.outputs.tag_name }}
    steps:
      # rpm for rpmsign and rpmkeys, which also sign the earlier releases' .rpm files.
      - name: Install git, gh, apt-ftparchive, createrepo_c and rpm
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git gh gnupg apt-utils createrepo-c rpm

      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Fetch this release's packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-linux-{deb,rpm}
          path: assets
          merge-multiple: true

      # The 9 releases before this one, so users can still pin or downgrade.
      - name: Fetch earlier releases' packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 30 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
              grep -vxF "${TAG_NAME}" | head -n 9 || true
          )
          for tag in "${tags[@]}"; do
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir assets --skip-existing \
              --pattern 'star-forge_*_amd64.deb' --pattern 'star-forge-*-1.x86_64.rpm' ||
              echo "${tag}: no Linux packages"
          done
          ls -l assets

      # import fails closed against the pin, as in sign-linux, and sets LINUX_SIGNED.
      - name: Build the repositories
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          packaging/ci/linux-signing.sh import
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="${PAGES_BASE_URL:-https://${owner}.github.io/${GITHUB_REPOSITORY#*/}}"
          packaging/ci/pages-repo.sh assets site "${base}" "${VERSION}"

      - name: Verify the repositories
        run: |
          set -euo pipefail
          for f in index.html deb/index.html rpm/index.html deb/dists/stable/Release \
            deb/star-forge.list rpm/star-forge.repo rpm/x86_64/repodata/repomd.xml \
            deb/dists/stable/main/binary-amd64/Packages.gz; do
            test -s "site/${f}"
          done
          # No `grep -q`: it exits on the first match, gzip dies of SIGPIPE, pipefail fails.
          gzip -cd site/deb/dists/stable/main/binary-amd64/Packages.gz |
            grep -Ex "Version: ${VERSION}(-[0-9]+)?" > /dev/null
          if [ "${LINUX_SIGNED}" = "true" ]; then
            test -s site/star-forge.asc
            test -s site/deb/dists/stable/InRelease
            test -s site/rpm/x86_64/repodata/repomd.xml.asc
            grep -qx gpgcheck=1 site/rpm/star-forge.repo
            packaging/ci/linux-signing.sh check-rpm site/rpm/*/*.rpm
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    name: Publish APT and DNF repositories (GitHub Pages)
    needs: repo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
