name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventional-commits:
    name: Conventional commit messages
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify Conventional Commit messages
        uses: opensource-nepal/commitlint@v2

  rust-quality:
    name: Rust quality (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run quality checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --no-default-features --all-targets -- -D warnings
          cargo test
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items

  msrv:
    name: MSRV build (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked

  musl:
    name: musl static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: Build
        run: |
          cargo build --locked --no-default-features --bin stfg --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/debug/stfg | grep -q static

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build .#default --print-build-logs
      - name: Check outputs
        run: |
          test -x result/bin/stfgd
          test -x result/bin/stfg
          grep -q "ExecStart=$(readlink -f result)/bin/stfgd" result/lib/systemd/user/star-forge.service

  macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # cfg-gated code must be warning-free on macOS too (dead code, unused imports, casts).
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      # macos-latest is arm64: the x86_64 slice can only be cross-built (linked), not run.
      - name: Build
        if: matrix.target == 'x86_64-apple-darwin'
        run: cargo build --locked --all-targets --target ${{ matrix.target }}
      - name: Test
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked --target ${{ matrix.target }}

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
