[settings]
lockfile = true
http_retries = 3
pin = true
fetch_remote_versions_cache = "4h"

[settings.status]
missing_tools = "always"

[tools]
rust = { version = "1.99.1", components = "rust-analyzer,rust-src" }
mr-boxington = { version = "1.27.0", workflow = "release.yml@refs/heads/main" }
rg = "15.2.0"
fd = "10.5.0"
jq = "1.8.2"
rtk = { version = "1.0.1", postinstall = "rtk init -g --auto-patch" }
"github:dmtrKovalenko/fff.nvim" = { version = "0.11.0", bin = "fff-mcp", platforms = { linux-x64 = { asset_pattern = "fff-mcp-x86_64-unknown-linux-musl" }, linux-arm64 = { asset_pattern = "fff-mcp-aarch64-unknown-linux-musl" }, macos-x64 = { asset_pattern = "fff-mcp-x86_64-apple-darwin" }, macos-arm64 = { asset_pattern = "fff-mcp-aarch64-apple-darwin" } } }
"github:redhat-et/ripwire" = { version = "0.6.8", bin = "ripwire", platforms = { linux-x64 = { asset_pattern = "ripwire-*-linux-x64.tar.gz" }, linux-arm64 = { asset_pattern = "ripwire-*-linux-arm64.tar.gz" }, macos-arm64 = { asset_pattern = "ripwire-*-macos-arm64.tar.gz" } } }
rumdl = "0.3.0"
# No Intel macOS build: without `os`, mise locks the man page (packslip.1) for macos-x64.
"github:jdx/packslip" = { version = "1.11.3", os = ["linux", "macos/arm64", "windows"] }
hyperfine = "2.0.0"
# Workflow lint (CI's actions-lint job reads the jactionlint version from here).
jactionlint = "2.3.0"
shellcheck = "0.11.0"
# Dependency licenses/bans/sources/advisories (CI's deny job pins the same version).
cargo-deny = "0.20.2"
# Tests for scripts/check-action-pins.sh (CI's pin-check job installs this version with
# bats-core/bats-action).
bats = "1.14.0"
# Dead code, duplication and complexity (`lint:fallow`, fallow.toml; CI runs fallow's action at
# the same version).
"github:fallow-rs/fallow" = "3.37.0"
# Cognitive/cyclomatic complexity ceilings for the Rust sources (`lint:complexity`, cccc.toml).
"github:moznion/cccc" = "1.8.5"

# Tasks that compile run Cargo through mbx (mr-boxington): compiled crates are cached and shared
# across checkouts. Plain `cargo` keeps working without it; CI uses plain Cargo.
[tasks.build]
description = "Build the Rust project"
run = "mbx build"

[tasks.build-release]
description = "Build the optimized release binaries"
run = "mbx build --release --locked"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = [
  "mbx clippy --all-targets --all-features -- -D warnings",
  "mbx clippy --no-default-features --all-targets -- -D warnings",
]

[tasks.test]
description = "Run the test suite"
run = "mbx test"

[tasks.doc]
description = "Build crate docs with warnings denied"
run = 'RUSTDOCFLAGS="-D warnings" mbx doc --no-deps --document-private-items'

[tasks.md-fmt]
description = "Format Markdown files"
run = "rumdl fmt ."

[tasks.md-check]
description = "Lint Markdown files"
run = "rumdl check ."

[tasks."lint:actions"]
description = "jactionlint (with shellcheck on run: scripts) on the workflows and dependabot.yml"
run = "jactionlint"

[tasks."lint:pins"]
description = "Check that every GitHub action is pinned to a commit SHA"
run = ["bats scripts/check-action-pins.bats", "sh scripts/check-action-pins.sh .github/workflows/*.yml"]

[tasks."lint:deny"]
description = "cargo-deny: dependency licenses, bans, sources and advisories"
run = "cargo deny check"

[tasks."lint:shell"]
description = "shellcheck the repository's shell scripts"
run = "shellcheck -S info scripts/*.sh scripts/*.bats packaging/macos/*.sh packaging/ci/*.sh"

[tasks."lint:complexity"]
description = "cccc: cognitive and cyclomatic complexity ceilings (cccc.toml); prints the 10 worst functions by each"
# Both rankings: either run fails on any ceiling, but only lists the offenders it ranks by.
run = "s=0; cccc --top-cognitive 10 src tests || s=$?; cccc --top-cyclomatic 10 src tests || s=$?; exit $s"

[tasks."lint:fallow"]
description = "fallow: dead code, duplication and complexity of any JavaScript/TypeScript (fallow.toml)"
run = "fallow"

[tasks.check]
description = "Run the full quality suite"
depends = ["fmt-check", "lint", "test", "doc", "md-check", "lint:actions", "lint:pins", "lint:shell", "lint:deny", "lint:complexity", "lint:fallow"]

[tasks.bench]
description = "Benchmark stfg against running the same commands directly"
env = { CARGO_BIN = "mbx" }
run = "bash scripts/bench.sh"
