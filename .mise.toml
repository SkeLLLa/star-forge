wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }
[settings]
lockfile = true
http_retries = 3
pin = true
fetch_remote_versions_cache = "4h"

[settings.status]
missing_tools = "always"

[tools]
rust = { version = "1.99.0", components = "rust-analyzer,rust-src" }
mr-boxington = "1.21.0"
rg = "15.2.0"
fd = "10.5.0"
jq = "1.8.2"
rtk = { version = "0.49.0", postinstall = "rtk init -g --claude" }
"github:dmtrKovalenko/fff.nvim" = { version = "0.11.0", bin = "fff-mcp", platforms = { linux-x64 = { asset_pattern = "fff-mcp-x86_64-unknown-linux-musl" }, linux-arm64 = { asset_pattern = "fff-mcp-aarch64-unknown-linux-musl" }, macos-x64 = { asset_pattern = "fff-mcp-x86_64-apple-darwin" }, macos-arm64 = { asset_pattern = "fff-mcp-aarch64-apple-darwin" } } }
"github:redhat-et/ripwire" = { version = "0.6.2", exe = "ripwire", platforms = { linux-x64 = { asset_pattern = "ripwire-*-linux-x64.tar.gz" }, linux-arm64 = { asset_pattern = "ripwire-*-linux-arm64.tar.gz" }, macos-x64 = { asset_pattern = "ripwire-*-macos-x64.tar.gz" }, macos-arm64 = { asset_pattern = "ripwire-*-macos-arm64.tar.gz" } } }
rumdl = "0.2.78"
"github:jdx/packslip" = "1.2.0"

[tasks.build]
description = "Build the Rust project"
run = "cargo build"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.doc]
description = "Build crate docs with warnings denied"
run = 'RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items'

[tasks.md-fmt]
description = "Format Markdown files"
run = "rumdl fmt ."

[tasks.md-check]
description = "Lint Markdown files"
run = "rumdl check ."

[tasks.check]
description = "Run the full quality suite"
depends = ["fmt-check", "lint", "test", "doc", "md-check"]
